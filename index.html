<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Switzerland Trip 2026 — Rahul</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap"
    rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #faf8f4;
      --card: #ffffff;
      --border: #e8e2d9;
      --border-strong: #c8bfb0;
      --text: #1a1714;
      --text-muted: #6b6158;
      --text-faint: #a09589;
      --accent: #c2401a;
      --accent-bg: #fdf0ec;
      --accent-border: #f5c4b0;
      --tag-booked-bg: #eaf3de;
      --tag-booked: #3b6d11;
      --tag-not-bg: #faeeda;
      --tag-not: #854f0b;
      --tag-free-bg: #e6f1fb;
      --tag-free: #185fa5;
      --tag-dash-bg: #f1efe8;
      --tag-dash: #5f5e5a;
      --bcn-bg: #e6f1fb;
      --bcn-fg: #185fa5;
      --luz-bg: #edf7ed;
      --luz-fg: #3b6d11;
      --grw-bg: #eeedfe;
      --grw-fg: #534ab7;
      --gva-bg: #fff0e8;
      --gva-fg: #993c1d;
      --mrt-bg: #fef3e2;
      --mrt-fg: #7a4f00;
      --tra-bg: #f5f0fa;
      --tra-fg: #534ab7;
      --radius: 10px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1714;
        --card: #242018;
        --border: #3a342c;
        --border-strong: #5a5047;
        --text: #f0ebe3;
        --text-muted: #a89e92;
        --text-faint: #6b6158;
        --accent: #e8673a;
        --accent-bg: #2a1a12;
        --accent-border: #6a3020;
        --tag-booked-bg: #173404;
        --tag-booked: #97c459;
        --tag-not-bg: #412402;
        --tag-not: #fac775;
        --tag-free-bg: #042c53;
        --tag-free: #85b7eb;
        --tag-dash-bg: #2c2c2a;
        --tag-dash: #b4b2a9;
        --bcn-bg: #0c1a2a;
        --bcn-fg: #85b7eb;
        --luz-bg: #0a1e0a;
        --luz-fg: #97c459;
        --grw-bg: #1a1236;
        --grw-fg: #afa9ec;
        --gva-bg: #2a1a0a;
        --gva-fg: #f0997b;
        --mrt-bg: #2a1e00;
        --mrt-fg: #f0c97b;
        --tra-bg: #1a1224;
        --tra-fg: #afa9ec;
      }
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: 14px;
      line-height: 1.5;
    }

    .hero {
      background: var(--accent-bg);
      border-bottom: 1px solid var(--accent-border);
      padding: 1.5rem 1rem 1.25rem;
    }

    .hero-inner {
      max-width: 1100px;
      margin: 0 auto;
    }

    .hero h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.4rem, 5vw, 2rem);
      font-weight: 600;
      color: var(--accent);
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .hero-sub {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 3px;
      font-weight: 300;
    }

    .cost-strip {
      display: flex;
      gap: 0.6rem;
      margin-top: 1rem;
      flex-wrap: wrap;
    }

    .cost-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.5rem 0.85rem;
      min-width: 110px;
      flex: 1;
    }

    .cost-card .label {
      font-size: 10px;
      color: var(--text-faint);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 500;
    }

    .cost-card .value {
      font-family: 'Playfair Display', serif;
      font-size: 1.2rem;
      color: var(--accent);
      font-weight: 600;
      margin-top: 1px;
    }

    .sync-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--text-faint);
      margin-top: 0.75rem;
    }

    .sync-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #97c459;
      flex-shrink: 0;
    }

    .sync-dot.syncing {
      background: #fac775;
      animation: pulse 1s infinite;
    }

    .sync-dot.error {
      background: #e24b4a;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1
      }

      50% {
        opacity: 0.4
      }
    }

    .main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1.25rem 1rem 4rem;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
    }

    .filter-tabs {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }

    .ftab {
      padding: 4px 10px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: transparent;
      font-size: 12px;
      color: var(--text-muted);
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .sub-toolbar {
      display: flex;
      gap: 6px;
      margin-top: 0.5rem;
      flex-wrap: wrap;
      padding-top: 0.5rem;
      border-top: 1px solid var(--border);
      width: 100%;
    }

    .ftab-sub {
      padding: 3px 10px;
      border: 1px solid transparent;
      border-radius: 6px;
      background: var(--tag-dash-bg);
      font-size: 11px;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s;
    }

    .ftab-sub.active {
      background: var(--accent-bg);
      color: var(--accent);
      border-color: var(--accent-border);
      font-weight: 500;
    }

    .ftab.active,
    .ftab:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .export-btn {
      padding: 4px 12px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: transparent;
      font-size: 12px;
      color: var(--text-muted);
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .export-btn:hover {
      border-color: var(--border-strong);
      color: var(--text);
    }

    .day-section {
      margin-bottom: 2rem;
    }

    .day-header {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 0.6rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border);
    }

    .day-badge {
      font-family: 'Playfair Display', serif;
      font-size: 1rem;
      font-weight: 600;
      color: var(--text);
    }

    .day-date {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 300;
    }

    .day-city {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 20px;
      font-weight: 500;
      margin-left: auto;
      white-space: nowrap;
    }

    .city-bcn {
      background: var(--bcn-bg);
      color: var(--bcn-fg);
    }

    .city-luz {
      background: var(--luz-bg);
      color: var(--luz-fg);
    }

    .city-grw {
      background: var(--grw-bg);
      color: var(--grw-fg);
    }

    .city-gva {
      background: var(--gva-bg);
      color: var(--gva-fg);
    }

    .city-mrt {
      background: var(--mrt-bg);
      color: var(--mrt-fg);
    }

    .city-tra {
      background: var(--tra-bg);
      color: var(--tra-fg);
    }

    .sbadge {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 500;
      white-space: nowrap;
    }

    .s-booked {
      background: var(--tag-booked-bg);
      color: var(--tag-booked);
    }

    .s-not {
      background: var(--tag-not-bg);
      color: var(--tag-not);
    }

    .s-free {
      background: var(--tag-free-bg);
      color: var(--tag-free);
    }

    .s-dash {
      background: var(--tag-dash-bg);
      color: var(--tag-dash);
    }

    /* desktop table */
    .tbl-wrap {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      min-width: 860px;
    }

    thead th {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-faint);
      font-weight: 500;
      padding: 0 6px 5px;
      text-align: left;
      white-space: nowrap;
    }

    .ch-time {
      width: 75px;
    }

    .ch-act {
      width: auto;
    }

    .ch-loc {
      width: 105px;
    }

    .ch-price {
      width: 68px;
    }

    .ch-hrs {
      width: 82px;
    }

    .ch-dur {
      width: 62px;
    }

    .ch-status {
      width: 90px;
    }

    .ch-map {
      width: 72px;
    }

    .ch-notes {
      width: 125px;
    }

    .ch-del {
      width: 26px;
    }

    tr.entry {
      transition: background 0.1s;
    }

    tr.entry:hover td {
      background: var(--accent-bg);
    }

    td {
      padding: 4px 6px;
      vertical-align: top;
    }

    td:first-child {
      border-radius: var(--radius) 0 0 var(--radius);
    }

    td:last-child {
      border-radius: 0 var(--radius) var(--radius) 0;
    }

    .cell-inp {
      width: 100%;
      background: transparent;
      border: none;
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      color: var(--text);
      padding: 2px 0;
      outline: none;
    }

    .cell-inp:focus {
      background: var(--card);
      border-radius: 4px;
      padding: 2px 4px;
      box-shadow: 0 0 0 2px var(--accent-border);
    }

    .cell-sel {
      width: 100%;
      background: transparent;
      border: none;
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      color: var(--text);
      padding: 2px 0;
      outline: none;
      cursor: pointer;
    }

    .map-link {
      font-size: 11px;
      color: var(--accent);
      text-decoration: none;
      display: block;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .map-link:hover {
      text-decoration: underline;
    }

    .add-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: transparent;
      border: 1px dashed var(--border-strong);
      border-radius: var(--radius);
      padding: 0.4rem 1rem;
      font-size: 12px;
      color: var(--text-faint);
      cursor: pointer;
      width: 100%;
      margin-top: 0.35rem;
      transition: all 0.15s;
      font-family: 'DM Sans', sans-serif;
    }

    .add-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-bg);
    }

    .del-btn {
      background: transparent;
      border: none;
      cursor: pointer;
      color: var(--text-faint);
      padding: 2px 3px;
      border-radius: 4px;
      font-size: 14px;
      line-height: 1;
      transition: color 0.1s;
    }

    .del-btn:hover {
      color: #e24b4a;
    }

    /* mobile cards */
    .mobile-cards {
      display: none;
    }

    @media (max-width: 700px) {
      .tbl-wrap {
        display: none;
      }

      .mobile-cards {
        display: block;
      }

      .m-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 0.75rem;
        margin-bottom: 0.5rem;
        position: relative;
        transition: border-left 0.2s;
      }

      .m-card.type-travel {
        border-left: 4px solid var(--accent);
      }

      .m-time-badge {
        font-size: 10px;
        color: var(--text-faint);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        font-weight: 500;
        margin-bottom: 3px;
      }

      .m-activity {
        font-size: 14px;
        font-weight: 500;
        color: var(--text);
        width: 100%;
        background: transparent;
        border: none;
        font-family: 'DM Sans', sans-serif;
        padding: 0;
        outline: none;
        line-height: 1.4;
        padding-right: 24px;
      }

      .m-activity:focus {
        text-decoration: underline;
        text-decoration-color: var(--accent-border);
      }

      .m-meta {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.35rem 0.75rem;
        margin-top: 0.5rem;
      }

      .m-field {
        display: flex;
        flex-direction: column;
        gap: 1px;
      }

      .m-label {
        font-size: 9px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--text-faint);
        font-weight: 500;
      }

      .m-val {
        font-size: 12px;
        color: var(--text);
        background: transparent;
        border: none;
        font-family: 'DM Sans', sans-serif;
        padding: 0;
        outline: none;
        width: 100%;
      }

      .m-val:focus {
        text-decoration: underline;
        text-decoration-color: var(--accent-border);
      }

      .m-sel {
        font-size: 12px;
        color: var(--text);
        background: transparent;
        border: none;
        font-family: 'DM Sans', sans-serif;
        padding: 0;
        outline: none;
        width: 100%;
        cursor: pointer;
      }

      .m-map-inp {
        font-size: 12px;
        color: var(--text-muted);
        background: transparent;
        border: none;
        font-family: 'DM Sans', sans-serif;
        padding: 0;
        outline: none;
        width: 100%;
      }

      .m-map-inp:focus {
        text-decoration: underline;
        text-decoration-color: var(--accent-border);
      }

      .m-map-link {
        font-size: 11px;
        color: var(--accent);
        text-decoration: none;
        display: inline-block;
        margin-top: 2px;
      }

      .m-map-link:hover {
        text-decoration: underline;
      }

      .m-notes-row {
        margin-top: 0.4rem;
      }

      .m-notes {
        font-size: 12px;
        color: var(--text-muted);
        background: transparent;
        border: none;
        font-family: 'DM Sans', sans-serif;
        padding: 0;
        outline: none;
        width: 100%;
        font-style: italic;
      }

      .m-notes:focus {
        font-style: normal;
        text-decoration: underline;
        text-decoration-color: var(--accent-border);
      }

      .m-notes::placeholder {
        color: var(--text-faint);
        font-style: italic;
      }

      .m-bottom {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 0.5rem;
        padding-top: 0.4rem;
        border-top: 1px solid var(--border);
      }

      .m-price-row {
        display: flex;
        align-items: center;
        gap: 3px;
        font-size: 12px;
        color: var(--text-muted);
      }

      .m-price-inp {
        font-size: 12px;
        color: var(--text-muted);
        background: transparent;
        border: none;
        font-family: 'DM Sans', sans-serif;
        padding: 0;
        outline: none;
        width: 70px;
      }

      .m-price-inp:focus {
        text-decoration: underline;
        text-decoration-color: var(--accent-border);
      }

      .m-del {
        position: absolute;
        top: 0.6rem;
        right: 0.6rem;
        background: transparent;
        border: none;
        cursor: pointer;
        color: var(--text-faint);
        font-size: 18px;
        line-height: 1;
        padding: 0;
        transition: color 0.1s;
      }

      .m-del:hover {
        color: #e24b4a;
      }
    }

    .no-rows {
      text-align: center;
      padding: 2rem;
      font-size: 13px;
      color: var(--text-faint);
      font-style: italic;
    }

    .save-banner {
      position: fixed;
      bottom: 1.25rem;
      right: 1rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.4rem 0.9rem;
      font-size: 12px;
      color: var(--text-muted);
      opacity: 0;
      transform: translateY(6px);
      transition: all 0.2s;
      pointer-events: none;
      z-index: 100;
    }

    .save-banner.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>

<body>

  <div class="hero">
    <div class="hero-inner">
      <h1>🏔 Switzerland Trip 2026</h1>
      <div class="hero-sub">Jun 20 – Jun 23 &nbsp;·&nbsp; BCN → ZRH → Lucerne → Grindelwald → Martigny → Geneva → BCN
      </div>
      <div class="cost-strip">
        <div class="cost-card">
          <div class="label">Total (INR)</div>
          <div class="value" id="total-cost">₹0</div>
        </div>
        <div class="cost-card">
          <div class="label">Activities</div>
          <div class="value" id="total-acts">0</div>
        </div>
        <div class="cost-card">
          <div class="label">Booked</div>
          <div class="value" id="total-booked">0</div>
        </div>
        <div class="cost-card">
          <div class="label">Not booked</div>
          <div class="value" id="total-nb">0</div>
        </div>
      </div>
      <div class="sync-status">
        <div class="sync-dot" id="sync-dot"></div>
        <span id="sync-label">Connecting…</span>
      </div>
    </div>
  </div>

  <div class="main">
    <div class="toolbar" style="flex-direction: column; align-items: flex-start; gap: 0.75rem;">
      <div
        style="display: flex; width: 100%; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem;">
        <div class="filter-tabs" id="main-filter-tabs">
          <button class="ftab active" onclick="setMainFilter('all', this)">All</button>
          <button class="ftab" onclick="setMainFilter('place', this)">📍 Places</button>
          <button class="ftab" onclick="setMainFilter('travel', this)">🚇 Travel</button>
        </div>
        <button class="export-btn" onclick="exportCSV()">Export CSV</button>
      </div>
      <div class="sub-toolbar" id="sub-filter-tabs"
        style="border-top: none; padding-top: 0; margin-top: 0; display: none;"></div>
    </div>
    <div id="root"></div>
  </div>

  <div class="save-banner" id="save-banner">Saving…</div>

  <script>
    const FB_URL = 'https://spain-trip-2026-rahul-default-rtdb.europe-west1.firebasedatabase.app/switzerland.json';

    let DATA = null;
    let saveTimer = null;
    let mainFilter = 'all';
    let subFilter = 'all';

    const TIME_OPTIONS = ['Early Morning', 'Morning', 'Afternoon', 'Late Afternoon', 'Evening', 'Night', 'Late Night', 'All day', '—'];
    const TYPE_OPTIONS = ['place', 'flight', 'train', 'bus'];


    function moveRow(dayId, rowId, direction) {
      const day = DATA.days.find(d => d.id === dayId);
      if (!day) return;
      const index = day.rows.findIndex(r => r.id === rowId);
      if (index === -1) return;

      const newIndex = index + direction;
      if (newIndex < 0 || newIndex >= day.rows.length) return; // Boundary check

      // Swap the items in place
      const temp = day.rows[index];
      day.rows[index] = day.rows[newIndex];
      day.rows[newIndex] = temp;

      render();
      scheduleSave();
    }

    /* ── FIREBASE ── */
    async function loadData() {
      setSyncState('syncing', 'Connecting…');
      try {
        const res = await fetch(FB_URL + '?t=' + Date.now());
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const raw = await res.json();

        /* Firebase returns null when the path is empty */
        if (raw === null || !raw.days || !Array.isArray(raw.days) || raw.days.length === 0) {
          DATA = DEFAULT_DATA;
          await pushToFirebase(false); /* seed the db silently */
        } else {
          /* Merge: ensure every row has a map and type field */
          raw.days.forEach(d => d.rows && d.rows.forEach(r => {
            if (!r.map) r.map = '';
            if (!r.type) r.type = 'place';
          }));
          DATA = raw;
        }
        setSyncState('ok', 'Synced — anyone with this link can edit');
      } catch (e) {
        console.warn('Firebase load error:', e);
        DATA = DEFAULT_DATA;
        setSyncState('error', 'Could not reach database — showing default data');
      }
      render();
    }

    async function pushToFirebase(showBannerMsg = true) {
      if (showBannerMsg) showBanner('Saving…');
      try {
        const res = await fetch(FB_URL, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(DATA)
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        setSyncState('ok', 'Saved · ' + new Date().toLocaleTimeString());
        if (showBannerMsg) showBanner('Saved ✓');
      } catch (e) {
        setSyncState('error', 'Save failed — try refreshing');
        if (showBannerMsg) showBanner('Save failed ✗');
      }
    }

    function scheduleSave() {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => pushToFirebase(true), 1000);
    }

    /* Poll every 30s so other devices see updates */
    setInterval(async () => {
      if (document.hidden || saveTimer) return;
      try {
        const res = await fetch(FB_URL + '?t=' + Date.now());
        if (!res.ok) return;
        const raw = await res.json();
        if (raw && raw.days && raw.days.length > 0) {
          raw.days.forEach(d => d.rows && d.rows.forEach(r => { if (!r.map) r.map = ''; }));
          DATA = raw;
          render();
          setSyncState('ok', 'Synced · ' + new Date().toLocaleTimeString());
        }
      } catch (e) { }
    }, 30000);

    function setSyncState(state, msg) {
      const dot = document.getElementById('sync-dot');
      const lbl = document.getElementById('sync-label');
      dot.className = 'sync-dot' + (state === 'syncing' ? ' syncing' : state === 'error' ? ' error' : '');
      lbl.textContent = msg;
    }
    function showBanner(msg) {
      const b = document.getElementById('save-banner');
      b.textContent = msg; b.classList.add('show');
      clearTimeout(b._t); b._t = setTimeout(() => b.classList.remove('show'), 2000);
    }

    /* ── HELPERS ── */
    function cityClass(c) { return 'city-' + c; }
    function cityLabel(c) { return { bcn: 'Zurich', luz: 'Lucerne', grw: 'Grindelwald', mrt: 'Martigny', gva: 'Geneva', tra: 'Flight / Transit' }[c] || c; }
    function esc(s) { return String(s || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
    function uid() { return 'r' + Math.random().toString(36).slice(2, 9); }
    function filterMatches(d) { return currentFilter === 'all' || d.city === currentFilter; }

    /* ── RENDER ── */
    function render() {
      updateStats();

      const addButtons = document.querySelectorAll('.add-btn');
      addButtons.forEach(btn => btn.style.display = isReadOnly ? 'none' : 'block');
      if (isReadOnly) setSyncState('ok', 'View Only Mode · Changes cannot be made');

      const subBar = document.getElementById('sub-filter-tabs');
      if (mainFilter === 'all') {
        subBar.style.display = 'none';
        subBar.innerHTML = '';
      } else {
        subBar.style.display = 'flex';
        let html = '';
        if (mainFilter === 'place') {
          const places = [{ id: 'all', l: 'All' }, { id: 'bcn', l: 'Zurich' }, { id: 'luz', l: 'Lucerne' }, { id: 'grw', l: 'Grindelwald' }, { id: 'mrt', l: 'Martigny' }, { id: 'gva', l: 'Geneva' }];
          html = places.map(p => `<button class="ftab-sub ${subFilter === p.id ? 'active' : ''}" onclick="setSubFilter('${p.id}')">${p.l}</button>`).join('');
        } else if (mainFilter === 'travel') {
          const transits = [{ id: 'all', l: 'All' }, { id: 'flight', l: '✈️ Flight' }, { id: 'train', l: '🚂 Train' }, { id: 'bus', l: '🚌 Bus/Taxi' }];
          html = transits.map(t => `<button class="ftab-sub ${subFilter === t.id ? 'active' : ''}" onclick="setSubFilter('${t.id}')">${t.l}</button>`).join('');
        }
        subBar.innerHTML = html;
      }

      const root = document.getElementById('root');
      root.innerHTML = '';

      DATA.days.forEach(day => {
        // Filter rows using the new matching rule
        const matchedRows = day.rows.filter(row => filterMatchesRow(row, day.city));
        if (matchedRows.length === 0 && mainFilter !== 'all') return; // hide empty day sections when actively filtering

        const sec = buildDayShell(day);
        root.appendChild(sec);

        const tbody = document.getElementById('tb-' + day.id);
        const mc = document.getElementById('mc-' + day.id);
        if (tbody) tbody.innerHTML = '';
        if (mc) mc.innerHTML = '';

        matchedRows.forEach(row => {
          if (tbody) tbody.appendChild(buildDesktopRow(day, row));
          if (mc) mc.appendChild(buildMobileCard(day, row));
        });
      });
    }

    function buildDayShell(day) {
      const sec = document.createElement('div');
      sec.className = 'day-section';
      sec.innerHTML = `
    <div class="day-header">
      <span class="day-badge">${day.label}</span>
      <span class="day-date">${day.date}</span>
      <span class="day-city ${cityClass(day.city)}">${cityLabel(day.city)}</span>
    </div>
    <div class="tbl-wrap">
      <table>
        <thead><tr>
          <th class="ch-time">Time</th>
          <th class="ch-act">Activity</th>
          <th class="ch-loc">Location</th>
          <th class="ch-price">Price (₹)</th>
          <th class="ch-hrs">Opening hrs</th>
          <th class="ch-dur">Duration</th>
          <th class="ch-status">Status</th>
          <th class="ch-map">Map</th>
          <th class="ch-notes">Notes</th>
          <th class="ch-del"></th>
        </tr></thead>
        <tbody id="tb-${day.id}"></tbody>
      </table>
    </div>
    <div class="mobile-cards" id="mc-${day.id}"></div>
    <button class="add-btn" onclick="addRow('${day.id}')">+ Add activity</button>`;
      return sec;
    }

    function populateRows(day) {
      const tbody = document.getElementById('tb-' + day.id);
      const mc = document.getElementById('mc-' + day.id);
      if (tbody) tbody.innerHTML = '';
      if (mc) mc.innerHTML = '';

      const filteredRows = day.rows.filter(row => {
        if (currentSubFilter === 'all') return true;
        if (currentFilter === 'tra') {
          // Transit tab specific sub-filters
          return row.type === currentSubFilter;
        } else {
          // Region specific sub-filters: Places vs Transit
          if (currentSubFilter === 'place') return row.type === 'place';
          if (currentSubFilter === 'travel') return row.type !== 'place';
        }
        return true;
      });

      filteredRows.forEach(row => {
        if (tbody) tbody.appendChild(buildDesktopRow(day, row));
        if (mc) mc.appendChild(buildMobileCard(day, row));
      });
    }

    function makeInp(val, field, dayId, rowId, ph) {
      const inp = document.createElement('input');
      inp.className = 'cell-inp';
      inp.value = val || '';
      inp.placeholder = ph || '';
      inp.addEventListener('input', () => updateField(dayId, rowId, field, inp.value));
      inp.addEventListener('change', () => updateField(dayId, rowId, field, inp.value));
      return inp;
    }

    function makeSel(val, dayId, rowId) {
      const sel = document.createElement('select');
      sel.className = 'cell-sel';
      ['Booked', 'Not Booked', 'Free', '-'].forEach(s => {
        const o = document.createElement('option');
        o.value = s; o.textContent = s;
        if (s === val) o.selected = true;
        sel.appendChild(o);
      });
      sel.addEventListener('change', () => updateField(dayId, rowId, 'status', sel.value));
      return sel;
    }

    function buildDesktopRow(day, row) {
      const tr = document.createElement('tr');
      tr.className = 'entry';

      /* 1. Time Column */
      const timeTd = document.createElement('td'); timeTd.className = 'ch-time';
      const timeSel = document.createElement('select');
      timeSel.className = 'cell-sel';
      TIME_OPTIONS.forEach(t => {
        const o = document.createElement('option'); o.value = t; o.textContent = t;
        if (t === row.time) o.selected = true;
        timeSel.appendChild(o);
      });
      timeSel.addEventListener('change', () => updateField(day.id, row.id, 'time', timeSel.value));
      timeTd.appendChild(timeSel);
      tr.appendChild(timeTd);

      /* 2. Activity Column */
      const actTd = document.createElement('td'); actTd.className = 'ch-act';
      actTd.appendChild(makeInp(row.act, 'act', day.id, row.id, 'Activity'));
      tr.appendChild(actTd);

      /* 3. Location Column */
      const locTd = document.createElement('td'); locTd.className = 'ch-loc';
      locTd.appendChild(makeInp(row.loc, 'loc', day.id, row.id, 'Location'));
      tr.appendChild(locTd);

      /* 4. Price Column */
      const priceTd = document.createElement('td'); priceTd.className = 'ch-price';
      priceTd.appendChild(makeInp(row.price, 'price', day.id, row.id, '0'));
      tr.appendChild(priceTd);

      /* 5. Opening Hrs Column */
      const hrsTd = document.createElement('td'); hrsTd.className = 'ch-hrs';
      hrsTd.appendChild(makeInp(row.hrs, 'hrs', day.id, row.id, '9am–5pm'));
      tr.appendChild(hrsTd);

      /* 6. Duration Column */
      const durTd = document.createElement('td'); durTd.className = 'ch-dur';
      durTd.appendChild(makeInp(row.dur, 'dur', day.id, row.id, '2 hrs'));
      tr.appendChild(durTd);

      /* 7. Status Column */
      const stTd = document.createElement('td'); stTd.className = 'ch-status';
      stTd.appendChild(makeSel(row.status, day.id, row.id));
      tr.appendChild(stTd);

      /* 8. Map Column */
      const mapTd = document.createElement('td'); mapTd.className = 'ch-map';
      const mapInp = makeInp(row.map, 'map', day.id, row.id, 'Paste link');
      mapTd.appendChild(mapInp);
      if (row.map && row.map.startsWith('http')) {
        const a = document.createElement('a');
        a.href = row.map; a.target = '_blank'; a.className = 'map-link'; a.textContent = '📍 Open';
        mapTd.appendChild(a);
      }
      tr.appendChild(mapTd);

      /* 9. Notes Column */
      const nTd = document.createElement('td'); nTd.className = 'ch-notes';
      nTd.appendChild(makeInp(row.notes, 'notes', day.id, row.id, 'Notes…'));
      tr.appendChild(nTd);

      /* 10. Del Column */
      const dTd = document.createElement('td'); dTd.className = 'ch-del';
      const delBtn = document.createElement('button'); delBtn.className = 'del-btn'; delBtn.textContent = '×';
      delBtn.onclick = () => deleteRow(day.id, row.id);
      dTd.appendChild(delBtn);
      tr.appendChild(dTd);

      if (isReadOnly) {
        tr.querySelectorAll('input, select').forEach(el => el.disabled = true);
        delBtn.style.display = 'none';
        document.querySelectorAll('.ch-del').forEach(th => th.style.display = 'none');
      }

      return tr;
    }

    function buildMobileCard(day, row) {
      const sClass = row.status === 'Booked' ? 's-booked' : row.status === 'Not Booked' ? 's-not' : row.status === 'Free' ? 's-free' : 's-dash';
      const card = document.createElement('div');
      card.className = 'm-card';
      if (row.type !== 'place') card.classList.add('type-travel');

      card.innerHTML = `
    <button class="m-del" onclick="deleteRow('${day.id}','${row.id}')">×</button>
    <div class="m-reorder-actions" style="display: flex; gap: 8px; margin-bottom: 4px;">
      <button class="ftab" onclick="moveRow('${day.id}', '${row.id}', -1)" style="padding: 2px 8px; font-size: 11px;">🔼 Up</button>
      <button class="ftab" onclick="moveRow('${day.id}', '${row.id}', 1)" style="padding: 2px 8px; font-size: 11px;">🔽 Down</button>
    </div>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
      <div class="m-field">
        <span class="m-label">Time</span>
        <select class="m-sel" data-field="time" style="font-weight: 500; font-size: 12px; color: var(--accent);">
          ${TIME_OPTIONS.map(t => `<option value="${t}"${t === row.time ? ' selected' : ''}>${t}</option>`).join('')}
        </select>
      </div>
      <div class="m-field">
        <span class="m-label">Type</span>
        <select class="m-sel" data-field="type" style="font-weight: 500; font-size: 12px; color: var(--text-muted);">
          ${TYPE_OPTIONS.map(t => `<option value="${t}"${t === row.type ? ' selected' : ''}>${t.charAt(0).toUpperCase() + t.slice(1)}</option>`).join('')}
        </select>
      </div>
    </div>
    <input class="m-activity" value="${esc(row.act)}" placeholder="Activity" data-field="act" style="margin-top: 4px;">
    <div class="m-meta">
      <div class="m-field"><span class="m-label">Location</span><input class="m-val" value="${esc(row.loc)}" placeholder="Location" data-field="loc"></div>
      <div class="m-field"><span class="m-label">Duration</span><input class="m-val" value="${esc(row.dur)}" placeholder="—" data-field="dur"></div>
      <div class="m-field"><span class="m-label">Opening hrs</span><input class="m-val" value="${esc(row.hrs)}" placeholder="—" data-field="hrs"></div>
      <div class="m-field"><span class="m-label">Status</span>
        <select class="m-sel" data-field="status">
          ${['Booked', 'Not Booked', 'Free', '-'].map(s => `<option value="${s}"${s === row.status ? ' selected' : ''}>${s}</option>`).join('')}
        </select>
      </div>
      <div class="m-field" style="grid-column:span 2">
        <span class="m-label">Google Maps link</span>
        <input class="m-map-inp" value="${esc(row.map)}" placeholder="Paste maps.app.goo.gl link" data-field="map">
        ${row.map && row.map.startsWith('http') ? `<a href="${esc(row.map)}" target="_blank" class="m-map-link">📍 Open map</a>` : ''}
      </div>
    </div>
    <div class="m-notes-row">
      <input class="m-notes" value="${esc(row.notes)}" placeholder="Notes…" data-field="notes">
    </div>
    <div class="m-bottom">
      <span class="sbadge ${sClass}">${row.status}</span>
      <span class="m-price-row">₹ <input class="m-price-inp" value="${esc(row.price)}" placeholder="0" data-field="price"></span>
    </div>`;

      card.querySelectorAll('[data-field]').forEach(el => {
        el.addEventListener('input', () => updateField(day.id, row.id, el.dataset.field, el.value));
        el.addEventListener('change', () => updateField(day.id, row.id, el.dataset.field, el.value));
      });

      if (isReadOnly) {
        card.querySelectorAll('input, select').forEach(el => el.disabled = true);
        const del = card.querySelector('.m-del'); if (del) del.style.display = 'none';
        const reo = card.querySelector('.m-reorder-actions'); if (reo) reo.style.display = 'none';
      }

      return card;
    }

    function updateField(dayId, rowId, field, value) {
      const day = DATA.days.find(d => d.id === dayId); if (!day) return;
      const row = day.rows.find(r => r.id === rowId); if (!row) return;
      row[field] = value;
      if (field === 'price' || field === 'status') updateStats();
      scheduleSave();
    }

    function addRow(dayId) {
      const day = DATA.days.find(d => d.id === dayId); if (!day) return;
      const newRow = { id: uid(), time: '—', dur: '', act: '', loc: '', price: '', hrs: '', status: '-', type: 'place', map: '', notes: '' };
      day.rows.push(newRow);
      render();
      updateStats();
      scheduleSave();
      const mc = document.getElementById('mc-' + dayId);
      if (mc && mc.lastElementChild) mc.lastElementChild.querySelector('input').focus();
    }

    function deleteRow(dayId, rowId) {
      const day = DATA.days.find(d => d.id === dayId); if (!day) return;
      if (day.rows.length <= 1) { alert('A day needs at least one entry.'); return; }
      day.rows = day.rows.filter(r => r.id !== rowId);
      render();
      updateStats();
      scheduleSave();
    }

    function updateStats() {
      if (!DATA) return;
      let total = 0, acts = 0, booked = 0, nb = 0;
      DATA.days.forEach(d => d.rows.forEach(r => {
        acts++;
        const p = parseFloat(r.price); if (!isNaN(p) && p > 0) total += p;
        if (r.status === 'Booked') booked++;
        if (r.status === 'Not Booked') nb++;
      }));
      document.getElementById('total-cost').textContent = '₹' + total.toLocaleString('en-IN');
      document.getElementById('total-acts').textContent = acts;
      document.getElementById('total-booked').textContent = booked;
      document.getElementById('total-nb').textContent = nb;
    }

    function setMainFilter(val, btn) {
      mainFilter = val;
      subFilter = 'all'; // reset sub-tier
      document.querySelectorAll('#main-filter-tabs .ftab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    }

    function setSubFilter(val) {
      subFilter = val;
      render();
    }

    function filterMatchesRow(row, dayCity) {
      // Tier 1 Check
      if (mainFilter === 'place' && row.type !== 'place') return false;
      if (mainFilter === 'travel' && row.type === 'place') return false;

      // Tier 2 Check
      if (subFilter === 'all') return true;
      if (mainFilter === 'place') {
        return dayCity === subFilter;
      }
      if (mainFilter === 'travel') {
        return row.type === subFilter;
      }
      return true;
    }

    function exportCSV() {
      const rows = [['Day', 'Date', 'City', 'Time', 'Type', 'Activity', 'Location', 'Price (INR)', 'Opening Hrs', 'Duration', 'Status', 'Map', 'Notes']];
      DATA.days.forEach(d => d.rows.forEach(r => {
        rows.push([d.label, d.date, cityLabel(d.city), r.time, r.type, r.act, r.loc, r.price, r.hrs, r.dur, r.status, r.map, r.notes]);
      }));
      const csv = rows.map(r => r.map(c => `"${String(c || '').replace(/"/g, '""')}"`).join(',')).join('\n');
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
      a.download = 'switzerland-trip-2026.csv'; a.click();
    }

    loadData();
  </script>
</body>

</html>
