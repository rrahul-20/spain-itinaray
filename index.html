<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spain Trip 2026 — Rahul</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap"
    rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #faf8f4;
      --card: #ffffff;
      --border: #e8e2d9;
      --border-strong: #c8bfb0;
      --text: #1a1714;
      --text-muted: #6b6158;
      --text-faint: #a09589;
      --accent: #c2401a;
      --accent-bg: #fdf0ec;
      --accent-border: #f5c4b0;
      --tag-booked-bg: #eaf3de;
      --tag-booked: #3b6d11;
      --tag-not-bg: #faeeda;
      --tag-not: #854f0b;
      --tag-free-bg: #e6f1fb;
      --tag-free: #185fa5;
      --tag-dash-bg: #f1efe8;
      --tag-dash: #5f5e5a;
      --bcn-bg: #e6f1fb;
      --bcn-fg: #185fa5;
      --rom-bg: #fff0e8;
      --rom-fg: #993c1d;
      --ven-bg: #edf7ed;
      --ven-fg: #3b6d11;
      --tra-bg: #f5f0fa;
      --tra-fg: #534ab7;
      --radius: 10px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1714;
        --card: #242018;
        --border: #3a342c;
        --border-strong: #5a5047;
        --text: #f0ebe3;
        --text-muted: #a89e92;
        --text-faint: #6b6158;
        --accent: #e8673a;
        --accent-bg: #2a1a12;
        --accent-border: #6a3020;
        --tag-booked-bg: #173404;
        --tag-booked: #97c459;
        --tag-not-bg: #412402;
        --tag-not: #fac775;
        --tag-free-bg: #042c53;
        --tag-free: #85b7eb;
        --tag-dash-bg: #2c2c2a;
        --tag-dash: #b4b2a9;
        --bcn-bg: #0c1a2a;
        --bcn-fg: #85b7eb;
        --rom-bg: #2a1a0a;
        --rom-fg: #f0997b;
        --ven-bg: #0a1e0a;
        --ven-fg: #97c459;
        --tra-bg: #1a1224;
        --tra-fg: #afa9ec;
      }
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: 14px;
      line-height: 1.5;
    }

    /* ── HERO ── */
    .hero {
      background: var(--accent-bg);
      border-bottom: 1px solid var(--accent-border);
      padding: 1.5rem 1rem 1.25rem;
    }

    .hero-inner {
      max-width: 960px;
      margin: 0 auto;
    }

    .hero h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.4rem, 5vw, 2rem);
      font-weight: 600;
      color: var(--accent);
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .hero-sub {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 3px;
      font-weight: 300;
    }

    .cost-strip {
      display: flex;
      gap: 0.6rem;
      margin-top: 1rem;
      flex-wrap: wrap;
    }

    .cost-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.5rem 0.85rem;
      min-width: 110px;
      flex: 1;
    }

    .cost-card .label {
      font-size: 10px;
      color: var(--text-faint);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 500;
    }

    .cost-card .value {
      font-family: 'Playfair Display', serif;
      font-size: 1.2rem;
      color: var(--accent);
      font-weight: 600;
      margin-top: 1px;
    }

    .sync-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.75rem;
    }

    .sync-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--text-faint);
    }

    .sync-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #97c459;
      flex-shrink: 0;
    }

    .sync-dot.syncing {
      background: #fac775;
      animation: pulse 1s infinite;
    }

    .sync-dot.error {
      background: #e24b4a;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1
      }

      50% {
        opacity: 0.4
      }
    }

    /* ── MAIN ── */
    .main {
      max-width: 960px;
      margin: 0 auto;
      padding: 1.25rem 1rem 4rem;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
    }

    .filter-tabs {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }

    .ftab {
      padding: 4px 10px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: transparent;
      font-size: 12px;
      color: var(--text-muted);
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      transition: all 0.15s;
    }

    .ftab.active,
    .ftab:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .export-btn {
      padding: 4px 12px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: transparent;
      font-size: 12px;
      color: var(--text-muted);
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .export-btn:hover {
      border-color: var(--border-strong);
      color: var(--text);
    }

    /* ── DAY SECTION ── */
    .day-section {
      margin-bottom: 2rem;
    }

    .day-header {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 0.6rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border);
    }

    .day-badge {
      font-family: 'Playfair Display', serif;
      font-size: 1rem;
      font-weight: 600;
      color: var(--text);
    }

    .day-date {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 300;
    }

    .day-city {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 20px;
      font-weight: 500;
      margin-left: auto;
      white-space: nowrap;
    }

    .city-bcn {
      background: var(--bcn-bg);
      color: var(--bcn-fg);
    }

    .city-rom {
      background: var(--rom-bg);
      color: var(--rom-fg);
    }

    .city-ven {
      background: var(--ven-bg);
      color: var(--ven-fg);
    }

    .city-tra {
      background: var(--tra-bg);
      color: var(--tra-fg);
    }

    /* ── STATUS BADGES ── */
    .sbadge {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 500;
      white-space: nowrap;
      cursor: default;
    }

    .s-booked {
      background: var(--tag-booked-bg);
      color: var(--tag-booked);
    }

    .s-not {
      background: var(--tag-not-bg);
      color: var(--tag-not);
    }

    .s-free {
      background: var(--tag-free-bg);
      color: var(--tag-free);
    }

    .s-dash {
      background: var(--tag-dash-bg);
      color: var(--tag-dash);
    }

    /* ── DESKTOP TABLE ── */
    .tbl-wrap {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      min-width: 700px;
    }

    thead th {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-faint);
      font-weight: 500;
      padding: 0 6px 5px;
      text-align: left;
      white-space: nowrap;
    }

    .ch-time {
      width: 80px;
    }

    .ch-act {
      width: auto;
    }

    .ch-loc {
      width: 110px;
    }

    .ch-price {
      width: 75px;
    }

    .ch-hrs {
      width: 85px;
    }

    .ch-dur {
      width: 65px;
    }

    .ch-status {
      width: 95px;
    }

    .ch-notes {
      width: 130px;
    }

    .ch-del {
      width: 28px;
    }

    tr.entry {
      transition: background 0.1s;
    }

    tr.entry:hover td {
      background: var(--accent-bg);
    }

    td {
      padding: 4px 6px;
      vertical-align: top;
    }

    td:first-child {
      border-radius: var(--radius) 0 0 var(--radius);
    }

    td:last-child {
      border-radius: 0 var(--radius) var(--radius) 0;
    }

    .cell-inp {
      width: 100%;
      background: transparent;
      border: none;
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      color: var(--text);
      padding: 2px 0;
      outline: none;
    }

    .cell-inp:focus {
      background: var(--card);
      border-radius: 4px;
      padding: 2px 4px;
      box-shadow: 0 0 0 2px var(--accent-border);
    }

    .cell-sel {
      width: 100%;
      background: transparent;
      border: none;
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      color: var(--text);
      padding: 2px 0;
      outline: none;
      cursor: pointer;
    }

    .add-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: transparent;
      border: 1px dashed var(--border-strong);
      border-radius: var(--radius);
      padding: 0.4rem 1rem;
      font-size: 12px;
      color: var(--text-faint);
      cursor: pointer;
      width: 100%;
      margin-top: 0.35rem;
      transition: all 0.15s;
      font-family: 'DM Sans', sans-serif;
    }

    .add-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-bg);
    }

    .del-btn {
      background: transparent;
      border: none;
      cursor: pointer;
      color: var(--text-faint);
      padding: 2px 3px;
      border-radius: 4px;
      font-size: 14px;
      line-height: 1;
      transition: color 0.1s;
    }

    .del-btn:hover {
      color: #e24b4a;
    }

    /* ── MOBILE CARDS (≤640px) ── */
    .mobile-cards {
      display: none;
    }

    @media (max-width: 640px) {
      .tbl-wrap {
        display: none;
      }

      .mobile-cards {
        display: block;
      }

      .m-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 0.75rem;
        margin-bottom: 0.5rem;
        position: relative;
      }

      .m-card-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 0.5rem;
        margin-bottom: 0.4rem;
      }

      .m-time-badge {
        font-size: 10px;
        color: var(--text-faint);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        font-weight: 500;
        white-space: nowrap;
        margin-top: 2px;
      }

      .m-activity {
        font-size: 14px;
        font-weight: 500;
        color: var(--text);
        flex: 1;
        min-width: 0;
        background: transparent;
        border: none;
        font-family: 'DM Sans', sans-serif;
        padding: 0;
        outline: none;
        width: 100%;
        line-height: 1.4;
      }

      .m-activity:focus {
        text-decoration: underline;
        text-decoration-color: var(--accent-border);
      }

      .m-meta {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.3rem 0.6rem;
        margin-top: 0.5rem;
      }

      .m-field {
        display: flex;
        flex-direction: column;
        gap: 1px;
      }

      .m-label {
        font-size: 9px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--text-faint);
        font-weight: 500;
      }

      .m-val {
        font-size: 12px;
        color: var(--text);
        background: transparent;
        border: none;
        font-family: 'DM Sans', sans-serif;
        padding: 0;
        outline: none;
        width: 100%;
      }

      .m-val:focus {
        text-decoration: underline;
        text-decoration-color: var(--accent-border);
      }

      .m-sel {
        font-size: 12px;
        color: var(--text);
        background: transparent;
        border: none;
        font-family: 'DM Sans', sans-serif;
        padding: 0;
        outline: none;
        width: 100%;
        cursor: pointer;
      }

      .m-notes-row {
        margin-top: 0.4rem;
      }

      .m-notes {
        font-size: 12px;
        color: var(--text-muted);
        background: transparent;
        border: none;
        font-family: 'DM Sans', sans-serif;
        padding: 0;
        outline: none;
        width: 100%;
        font-style: italic;
      }

      .m-notes:focus {
        font-style: normal;
        text-decoration: underline;
        text-decoration-color: var(--accent-border);
      }

      .m-notes::placeholder {
        color: var(--text-faint);
        font-style: italic;
      }

      .m-del {
        position: absolute;
        top: 0.5rem;
        right: 0.5rem;
        background: transparent;
        border: none;
        cursor: pointer;
        color: var(--text-faint);
        font-size: 16px;
        line-height: 1;
        padding: 2px 4px;
        border-radius: 4px;
        transition: color 0.1s;
      }

      .m-del:hover {
        color: #e24b4a;
      }

      .m-status-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 0.5rem;
        padding-top: 0.4rem;
        border-top: 1px solid var(--border);
      }

      .m-price-inline {
        font-size: 12px;
        color: var(--text-muted);
      }

      .m-price-inp {
        font-size: 12px;
        color: var(--text-muted);
        background: transparent;
        border: none;
        font-family: 'DM Sans', sans-serif;
        padding: 0;
        outline: none;
        width: 80px;
        text-align: right;
      }

      .m-price-inp:focus {
        text-decoration: underline;
        text-decoration-color: var(--accent-border);
      }
    }

    /* ── MISC ── */
    .no-rows {
      text-align: center;
      padding: 2rem;
      font-size: 13px;
      color: var(--text-faint);
      font-style: italic;
    }

    .save-banner {
      position: fixed;
      bottom: 1.25rem;
      right: 1rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.4rem 0.9rem;
      font-size: 12px;
      color: var(--text-muted);
      opacity: 0;
      transform: translateY(6px);
      transition: all 0.2s;
      pointer-events: none;
      z-index: 100;
    }

    .save-banner.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>

  <div class="hero">
    <div class="hero-inner">
      <h1>✈ Spain Trip 2026</h1>
      <div class="hero-sub">Jun 11 – Jun 25 &nbsp;·&nbsp; BLR → BCN → Rome → Venice → BCN → BLR</div>
      <div class="cost-strip">

        <div class="cost-card">

        <div class="cost-card">

      <div class="sync-row">

          <div class="sync-dot" id="sync-dot"></div>
          <span id="sync-label">Connecting…</span>
        </div>
      </div>
    </div>
  </div>

  <div class="main">
    <div class="toolbar">

      </div>
      <button class="export-btn" onclick="exportCSV()">Export CSV</button>
    </div>
    <div id="root"></div>
  </div>

        },
        {
          id: 'd14', label: 'Day 14', date: '24 Jun', city: 'tra', rows: [
            { id: 'r036', time: 'Morning', dur: '2h', act: 'Flight VCE → BCN', loc: 'Venice → Barcelona', price: '1388', hrs: '09:10 depart', status: 'Not Booked', notes: 'Arrives BCN 11:10' },
            { id: 'r037', time: 'Afternoon', dur: '', act: 'BCN layover — rest / explore', loc: 'Barcelona', price: '', hrs: '-', status: '-', notes: 'Return flight at 22:30' },
            { id: 'r038', time: 'Night', dur: '', act: 'Depart BCN → AUH → BLR (Etihad)', loc: 'BCN → BLR', price: '', hrs: '22:30 depart', status: 'Booked', notes: 'Terminal 1. Arrives BLR 25 Jun 14:15' },
          ]
        },
        {
          id: 'd15', label: 'Day 15', date: '25 Jun', city: 'tra', rows: [
            { id: 'r039', time: 'Afternoon', dur: '', act: 'Arrive BLR Terminal 2', loc: 'Bengaluru (BLR)', price: '', hrs: '14:15', status: 'Booked', notes: 'Layover AUH 07:05–08:40' },
          ]
        },
      ]
    };

    let DATA = null;
    let saveTimer = null;
    let currentFilter = 'all';
    let isSaving = false;

    /* ── FIREBASE SYNC ── */
    async function loadData() {
      setSyncState('syncing', 'Connecting…');
      try {
        const res = await fetch(FB_URL, { cache: 'no-store' });
        if (!res.ok) throw new Error('fetch failed');
        const remote = await res.json();
        if (remote && remote.days && remote.days.length > 0) {
          DATA = remote;
        } else {
          DATA = DEFAULT_DATA;
          await pushToFirebase();
        }
        setSyncState('ok', 'Synced — anyone with this link can edit');
      } catch (e) {
        console.warn('Firebase load failed:', e);
        DATA = DEFAULT_DATA;
        setSyncState('error', 'Offline — showing default data');
      }
      render();
    }

    async function pushToFirebase() {
      try {
        await fetch(FB_URL, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(DATA)
        });
        setSyncState('ok', 'Saved · ' + new Date().toLocaleTimeString());
        showBanner('Saved ✓');
      } catch (e) {
        setSyncState('error', 'Save failed');
        showBanner('Save failed ✗');
      }
    }

    function scheduleSave() {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(pushToFirebase, 1000);
    }

    function setSyncState(state, msg) {
      const dot = document.getElementById('sync-dot');
      const lbl = document.getElementById('sync-label');
      dot.className = 'sync-dot' + (state === 'syncing' ? ' syncing' : state === 'error' ? ' error' : '');
      lbl.textContent = msg;
    }

    function showBanner(msg) {
      const b = document.getElementById('save-banner');
      b.textContent = msg; b.classList.add('show');
      clearTimeout(b._t); b._t = setTimeout(() => b.classList.remove('show'), 2000);
    }

    /* ── RENDER ── */
    function cityClass(c) { return 'city-' + c; }
    function cityLabel(c) { return { bcn: 'Barcelona', rom: 'Rome', ven: 'Venice', tra: 'Flight / Transit' }[c] || c; }
    function sBadge(s) {
      const cls = s === 'Booked' ? 's-booked' : s === 'Not Booked' ? 's-not' : s === 'Free' ? 's-free' : 's-dash';
      return `<span class="sbadge ${cls}">${s}</span>`;
    }
    function esc(s) { return String(s || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
    function uid() { return 'r' + Math.random().toString(36).slice(2, 9); }

    function filterMatches(d) {
      if (currentFilter === 'all') return true;
      return d.city === currentFilter;
    }

    function render() {
      updateStats();
      const root = document.getElementById('root');
      root.innerHTML = '';
      const days = DATA.days.filter(filterMatches);
      if (!days.length) { root.innerHTML = '<div class="no-rows">No days match this filter.</div>'; return; }
      days.forEach(day => root.appendChild(buildDay(day)));
    }

    function buildDay(day) {
      const sec = document.createElement('div');
      sec.className = 'day-section';

      /* header */
      const hdr = document.createElement('div');
      hdr.className = 'day-header';
      hdr.innerHTML = `
    <span class="day-badge">${day.label}</span>
    <span class="day-date">${day.date}</span>
    <span class="day-city ${cityClass(day.city)}">${cityLabel(day.city)}</span>`;
      sec.appendChild(hdr);

      /* desktop table */
      const wrap = document.createElement('div');
      wrap.className = 'tbl-wrap';
      const tbl = document.createElement('table');
      tbl.innerHTML = `<thead><tr>
    <th class="ch-time">Time</th>
    <th class="ch-act">Activity</th>
    <th class="ch-loc">Location</th>
    <th class="ch-price">Price (₹)</th>
    <th class="ch-hrs">Opening hrs</th>
    <th class="ch-dur">Duration</th>
    <th class="ch-status">Status</th>
    <th class="ch-notes">Notes</th>
    <th class="ch-del"></th>
  </tr></thead>`;
      const tbody = document.createElement('tbody');
      tbody.id = 'tb-' + day.id;
      tbl.appendChild(tbody);
      wrap.appendChild(tbl);
      sec.appendChild(wrap);

      /* mobile cards container */
      const mCards = document.createElement('div');
      mCards.className = 'mobile-cards';
      mCards.id = 'mc-' + day.id;
      sec.appendChild(mCards);

      /* add button */
      const addBtn = document.createElement('button');
      addBtn.className = 'add-btn';
      addBtn.textContent = '+ Add activity';
      addBtn.onclick = () => addRow(day.id);
      sec.appendChild(addBtn);

      renderRows(day);
      return sec;
    }

    function renderRows(day) {
      /* desktop */
      const tbody = document.getElementById('tb-' + day.id);
      if (tbody) { tbody.innerHTML = ''; day.rows.forEach(r => tbody.appendChild(buildDesktopRow(day, r))); }
      /* mobile */
      const mc = document.getElementById('mc-' + day.id);
      if (mc) { mc.innerHTML = ''; day.rows.forEach(r => mc.appendChild(buildMobileCard(day, r))); }
    }

    function makeInp(val, field, dayId, rowId, placeholder) {
      const inp = document.createElement('input');
      inp.className = 'cell-inp'; inp.value = val || ''; inp.placeholder = placeholder || '';
      inp.addEventListener('input', () => { updateField(dayId, rowId, field, inp.value); });
      return inp;
    }

    function makeSel(val, dayId, rowId) {
      const sel = document.createElement('select');
      sel.className = 'cell-sel';
      ['Booked', 'Not Booked', 'Free', '-'].forEach(s => {
        const o = document.createElement('option'); o.value = s; o.textContent = s;
        if (s === val) o.selected = true;
        sel.appendChild(o);
      });
      sel.addEventListener('change', () => { updateField(dayId, rowId, 'status', sel.value); });
      return sel;
    }

    function buildDesktopRow(day, row) {
      const tr = document.createElement('tr');
      tr.className = 'entry';
      const fields = [
        ['ch-time', 'time', 'Morning'], ['ch-act', 'act', 'Activity'], ['ch-loc', 'loc', 'Location'],
        ['ch-price', 'price', '0'], ['ch-hrs', 'hrs', '9am–5pm'], ['ch-dur', 'dur', '2 hrs'],
      ];
      fields.forEach(([cls, f, ph]) => {
        const td = document.createElement('td'); td.className = cls;
        td.appendChild(makeInp(row[f], f, day.id, row.id, ph));
        tr.appendChild(td);
      });
      /* status */
      const stTd = document.createElement('td'); stTd.className = 'ch-status';
      stTd.appendChild(makeSel(row.status, day.id, row.id));
      tr.appendChild(stTd);
      /* notes */
      const nTd = document.createElement('td'); nTd.className = 'ch-notes';
      nTd.appendChild(makeInp(row.notes, 'notes', day.id, row.id, 'Notes…'));
      tr.appendChild(nTd);
      /* del */
      const dTd = document.createElement('td'); dTd.className = 'ch-del';
      const delBtn = document.createElement('button'); delBtn.className = 'del-btn'; delBtn.textContent = '×';
      delBtn.onclick = () => deleteRow(day.id, row.id);
      dTd.appendChild(delBtn); tr.appendChild(dTd);
      return tr;
    }

    function buildMobileCard(day, row) {
      const card = document.createElement('div');
      card.className = 'm-card';

      const sClass = row.status === 'Booked' ? 's-booked' : row.status === 'Not Booked' ? 's-not' : row.status === 'Free' ? 's-free' : 's-dash';

      card.innerHTML = `
    <button class="m-del" onclick="deleteRow('${day.id}','${row.id}')">×</button>
    <div class="m-time-badge">${esc(row.time) || '—'}</div>
    <div class="m-card-top">
      <input class="m-activity" value="${esc(row.act)}" placeholder="Activity" data-field="act">
    </div>
    <div class="m-meta">
      <div class="m-field">
        <span class="m-label">Location</span>
        <input class="m-val" value="${esc(row.loc)}" placeholder="Location" data-field="loc">
      </div>
      <div class="m-field">
        <span class="m-label">Duration</span>
        <input class="m-val" value="${esc(row.dur)}" placeholder="—" data-field="dur">
      </div>
      <div class="m-field">
        <span class="m-label">Opening hrs</span>
        <input class="m-val" value="${esc(row.hrs)}" placeholder="—" data-field="hrs">
      </div>
      <div class="m-field">
        <span class="m-label">Status</span>
        <select class="m-sel" data-field="status">
          ${['Booked', 'Not Booked', 'Free', '-'].map(s => `<option value="${s}"${s === row.status ? ' selected' : ''}>${s}</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="m-notes-row">
      <input class="m-notes" value="${esc(row.notes)}" placeholder="Notes…" data-field="notes">
    </div>
    <div class="m-status-row">
      <span class="sbadge ${sClass}" id="mbadge-${row.id}">${row.status}</span>
      <span class="m-price-inline">₹&nbsp;<input class="m-price-inp" value="${esc(row.price)}" placeholder="0" data-field="price"></span>
    </div>`;

      /* bind all inputs */
      card.querySelectorAll('[data-field]').forEach(el => {
        const field = el.dataset.field;
        el.addEventListener('input', () => { updateField(day.id, row.id, field, el.value); });
        el.addEventListener('change', () => { updateField(day.id, row.id, field, el.value); });
      });

      return card;
    }

    function updateField(dayId, rowId, field, value) {
      const day = DATA.days.find(d => d.id === dayId);
      if (!day) return;
      const row = day.rows.find(r => r.id === rowId);
      if (!row) return;
      row[field] = value;
      if (field === 'price' || field === 'status') updateStats();
      scheduleSave();
    }

    function addRow(dayId) {
      const day = DATA.days.find(d => d.id === dayId);
      if (!day) return;
      const newRow = { id: uid(), time: '', dur: '', act: '', loc: '', price: '', hrs: '', status: '-', notes: '' };
      day.rows.push(newRow);
      renderRows(day);
      updateStats();
      scheduleSave();
      /* focus first input of new mobile card */
      const mc = document.getElementById('mc-' + dayId);
      if (mc) { const inp = mc.lastElementChild && mc.lastElementChild.querySelector('input'); if (inp) inp.focus(); }
    }

    function deleteRow(dayId, rowId) {
      const day = DATA.days.find(d => d.id === dayId);
      if (!day) return;
      if (day.rows.length <= 1) { alert('A day needs at least one entry.'); return; }
      day.rows = day.rows.filter(r => r.id !== rowId);
      renderRows(day);
      updateStats();
      scheduleSave();
    }

    function updateStats() {
      if (!DATA) return;
      let total = 0, acts = 0, booked = 0, nb = 0;
      DATA.days.forEach(d => d.rows.forEach(r => {
        acts++;
        const p = parseFloat(r.price); if (!isNaN(p) && p > 0) total += p;
        if (r.status === 'Booked') booked++;
        if (r.status === 'Not Booked') nb++;
      }));
      document.getElementById('total-cost').textContent = '₹' + total.toLocaleString('en-IN');
      document.getElementById('total-acts').textContent = acts;
      document.getElementById('total-booked').textContent = booked;
      document.getElementById('total-nb').textContent = nb;
    }

    function filterBy(city, btn) {
      currentFilter = city;
      document.querySelectorAll('.ftab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    }

    function exportCSV() {
      const rows = [['Day', 'Date', 'City', 'Time', 'Activity', 'Location', 'Price (INR)', 'Opening Hrs', 'Duration', 'Status', 'Notes']];
      DATA.days.forEach(d => d.rows.forEach(r => {
        rows.push([d.label, d.date, cityLabel(d.city), r.time, r.act, r.loc, r.price, r.hrs, r.dur, r.status, r.notes]);
      }));
      const csv = rows.map(r => r.map(c => `"${String(c || '').replace(/"/g, '""')}"`).join(',')).join('\n');
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
      a.download = 'spain-trip-2026.csv'; a.click();
    }

    loadData();

    /* ── Poll every 30s so other devices see edits ── */
    setInterval(async () => {
      if (document.hidden) return;
      try {
        const res = await fetch(FB_URL, { cache: 'no-store' });
        if (!res.ok) return;
        const remote = await res.json();
        if (remote && remote.days) {
          DATA = remote; render();
          setSyncState('ok', 'Synced · ' + new Date().toLocaleTimeString());
        }
      } catch (e) { }
    }, 30000);
  </script>
